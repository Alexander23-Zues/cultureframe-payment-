services:
  - type: web
    name: cultureframe-payments
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run db:mysql:generate && npm run build
    preDeployCommand: npm run db:mysql:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.2
      - key: INTEGRATION_MODE
        value: live
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
